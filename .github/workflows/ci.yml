name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore CSharp_SimpleZipDrive.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build CSharp_SimpleZipDrive.sln -c Release --no-restore -warnaserror

      - name: Test with coverage
        run: >-
          dotnet test SimpleZipDrive.Tests\SimpleZipDrive.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Write coverage summary
        if: always()
        shell: pwsh
        run: |
          $coverage = Get-ChildItem -LiteralPath TestResults -Filter coverage.cobertura.xml -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $coverage) {
            Write-Host 'No coverage report found.'
            exit 0
          }

          [xml] $report = Get-Content -LiteralPath $coverage.FullName
          $lineRate = [math]::Round([double]::Parse($report.coverage.'line-rate', [cultureinfo]::InvariantCulture) * 100, 1)
          $branchRate = [math]::Round([double]::Parse($report.coverage.'branch-rate', [cultureinfo]::InvariantCulture) * 100, 1)

          @(
            '### Code coverage'
            ''
            "- Line coverage: **$lineRate%**"
            "- Branch coverage: **$branchRate%**"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: 'TestResults/**/*.trx'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: 'TestResults/**/coverage.cobertura.xml'
          if-no-files-found: ignore
          retention-days: 14

  build-cross-platform:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore SimpleZipDrive/SimpleZipDrive.csproj

      - name: Build (Release)
        run: dotnet build SimpleZipDrive/SimpleZipDrive.csproj -c Release --no-restore

  dependency-audit:
    name: Dependency audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore CSharp_SimpleZipDrive.sln

      - name: Audit NuGet packages for known vulnerabilities
        shell: pwsh
        run: |
          $json = dotnet list CSharp_SimpleZipDrive.sln package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $findings = foreach ($project in $json.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                foreach ($vulnerability in $package.vulnerabilities) {
                  [pscustomobject] @{
                    Project     = $project.path
                    Package     = $package.id
                    Version     = $package.resolvedVersion
                    Severity    = $vulnerability.severity
                    AdvisoryUrl = $vulnerability.advisoryurl
                  }
                }
              }
            }
          }

          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            throw "Found $($findings.Count) vulnerable NuGet package(s). Update the dependencies before merging."
          }

          Write-Host 'No vulnerable NuGet packages found.'

  ci-success:
    name: CI success
    if: always()
    needs: [build-test, build-cross-platform, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          BUILD_CROSS_PLATFORM: ${{ needs.build-cross-platform.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          echo "build-test: $BUILD_TEST"
          echo "build-cross-platform: $BUILD_CROSS_PLATFORM"
          echo "dependency-audit: $DEPENDENCY_AUDIT"
          if [ "$BUILD_TEST" != "success" ] || [ "$BUILD_CROSS_PLATFORM" != "success" ] || [ "$DEPENDENCY_AUDIT" != "success" ]; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
